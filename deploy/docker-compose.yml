# Minimal self-contained DataLens cluster with the Rust monolith as the whole server side.
#
#   ./deploy/cluster.sh up      # bootstrap secrets/certs, build, start
#   ./deploy/cluster.sh down
#   open http://localhost:8091  (admin / admin; change the password after first login)
#
# Services:
#   postgres  – DataLens Postgres 16 image with the pg-* databases restored from ./seed
#   auth      – Rust auth (login/JWT/users), replaces datalens-auth:0.27.0
#   monolith  – Rust binary: US + data-api + ui-api + control-api + meta-manager
#   ui        – datalens-ui:0.3831.0 in `full` mode, nginx terminates :8091 (HTTP/1.1)
#               and :8092 (HTTPS + HTTP/2)
#
# Secret material (RSA keys, master tokens) is NOT in this file: ./deploy/bootstrap.sh
# writes deploy/secrets/compose.secrets.yml and ./deploy/cluster.sh merges it in.
name: datalens-rust

networks:
  datalens:
    driver: bridge

volumes:
  pg_data:

services:
  postgres:
    image: ghcr.io/datalens-tech/datalens-postgres:16-1.3.0
    environment:
      POSTGRES_USER: pg-user
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
      POSTGRES_MAX_CONNECTIONS: "512"
      POSTGRES_DUMP_SKIP_CONFLICT: "true"
      PGDATA: /var/lib/postgresql/data
      TZ: Etc/UTC
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./seed:/seed:ro
      - ./seed/init-dbs.sh:/docker-entrypoint-initdb.d/00-restore.sh:ro
    ports:
      - "127.0.0.1:25434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pg-user -d pg-us-db"]
      interval: 5s
      timeout: 5s
      retries: 40
    restart: unless-stopped

  auth:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.auth
    environment:
      AUTH_PORT: "8097"
      AUTH_POSTGRES_DSN: postgres://pg-user:postgres@postgres:5432/pg-auth-db
      AUTH_SIGNUP_DISABLED: "true"
      AUTH_DB_POOL_SIZE: "4"
      RUST_LOG: info
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8097:8097"
    restart: unless-stopped

  monolith:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.monolith
    environment:
      MONOLITH: "1"
      PUBLIC_PORT: "8099"
      POSTGRES_DSN_LIST: postgres://pg-user:postgres@postgres:5432/pg-us-db
      META_MANAGER_PG_DSN: postgres://pg-user:postgres@postgres:5432/pg-meta-manager-db
      # demo datasets store the host `postgres` in their connection settings
      DL_CONNECTION_HOST_MAP: postgres=postgres:5432
      US_URL: http://127.0.0.1:8099
      META_US_URL: http://127.0.0.1:8099
      UI_PUBLIC_URL: http://127.0.0.1:8099
      CONTROL_API_URL: http://127.0.0.1:8099
      AUTH_ENABLED: "true"
      AUTH__TYPE: NATIVE
      AUTH__JWT_ALGORITHM: PS256
      RUST_LOG: info
      DL_RAW_RESULT: "1"
      DL_RAW_V8: "1"
      DL_COMPRESSION: zstd
      DL_COMPRESS_MIN_CHUNK: "4096"
      DL_DB_POOL_SIZE: "20"
      DL_CONNECTION_CACHE_TTL_SECS: "0"
      TOKIO_WORKER_THREADS: "7"
      DL_DIALECT: postgres
      DL_US_BRANCH: published
      DL_US_CACHE_TTL_SECS: "0"
      PREPARE_CACHE_TTL_SECS: "0"
      US_ENTRY_CACHE_TTL_SECS: "60"
      DATASET_FIELDS_TTL_SECS: "0"
      FIELDS_CACHE_AUTH: "true"
      TENANT_ID_OVERRIDE: common
      US_SURPRESS_DB_STATUS_LOGS: "true"
      EXPORT_DATA_VERIFICATION_KEY: dev-export-verification-key
      DL_CRY_ACTUAL_KEY_ID: KEY
      DL_CRY_KEY_VAL_ID_KEY: ZGF0YWxlbnN1bnNlY3VyZWZlcm5ldGNyeXB0b2tleQo=
      # memory profile (see docs/MEMORY.md)
      MIMALLOC_PURGE_DELAY: "0"
      CHART_EXTRA_CACHE_MAX: "256"
      PARSED_SHARED_CACHE_MAX: "128"
      PARSED_SHARED_CACHE_TTL_SECS: "900"
      TABLE_REQUEST_CACHE_MAX: "128"
      US_ENTRY_CACHE_MAX: "256"
    depends_on:
      postgres:
        condition: service_healthy
      auth:
        condition: service_started
    ports:
      - "127.0.0.1:8099:8099"
    healthcheck:
      test: ["CMD", "/usr/local/bin/monolith", "--healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  ui:
    image: ghcr.io/datalens-tech/datalens-ui:0.3831.0
    environment:
      APP_MODE: full
      APP_ENV: production
      APP_INSTALLATION: opensource
      APP_VERSION: 0.3831.0
      RELEASE_VERSION: 2.9.0
      NODE_ENV: production
      APP_PORT: "3030"
      WORKERS: "1"
      TZ: Etc/UTC
      AUTH_ENABLED: "true"
      AUTH_POLICY: required
      AUTH_SIGNUP_DISABLED: "true"
      AUTH_ENDPOINT: http://auth:8097
      US_ENDPOINT: http://monolith:8099
      BI_DATA_ENDPOINT: http://monolith:8099
      BI_API_ENDPOINT: http://monolith:8099
      META_MANAGER_ENDPOINT: http://monolith:8099
      EXPORT_WORKBOOK_ENABLED: "true"
      UI_CORE_CDN: "false"
      APP_BUILDER_CDN: "false"
      HC: "0"
      HC_MODULES: ""
      HC_ENDPOINT: ""
      HC_PROTOCOL: ""
      YANDEX_MAP_ENABLED: "0"
      YANDEX_MAP_TOKEN: ""
    volumes:
      - ./certs:/etc/nginx/certs:ro
      - ./ui-nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      auth:
        condition: service_started
      monolith:
        condition: service_started
    ports:
      - "8091:8080"
      - "8092:8443"
    restart: unless-stopped
